plugins {
    id "java"
    id "maven-publish"
    id "idea"
    id "eclipse"
    id "com.gorylenko.gradle-git-properties"
    alias(libs.plugins.spring.boot)
    id "jhipster.cucumber-conventions"
    id "jhipster.gatling-conventions"
    id "jhipster.spring-cache-conventions"
    id "jhipster.docker-conventions"
    id "jhipster.code-quality-conventions"
    id "org.liquibase.gradle"
    id "jhipster.pulsar-conventions"
    id "jhipster.node-gradle-conventions"
    // jhipster-needle-gradle-plugins - JHipster will add additional gradle plugins here
}

group = "io.hpp.noosphere.gw"
version = "1.0.0-SNAPSHOT"

description = ""

sourceCompatibility=17
targetCompatibility=17
assert ["17", "21", "24"].contains(System.properties["java.specification.version"])

ext {
    querydslVersion = "${querydslVersion}"
    springProfiles = ""
    def noosphereCommonBaseVersion = noosphereCommonVersion
    noosphereCommonVersion = "${noosphereCommonBaseVersion}-test-SNAPSHOT" // Default version
    if (project.hasProperty("tls")) {
        springProfiles += ",tls"
    }
    if (project.hasProperty("e2e")) {
        springProfiles += ",e2e"
    }
    if (project.hasProperty("prod")) {
        noosphereCommonVersion = noosphereCommonBaseVersion
    } else if (project.hasProperty("test2")) {
        noosphereCommonVersion = "${noosphereCommonBaseVersion}-test-SNAPSHOT"
    }
}

repositories {
    // Local maven repository is required for libraries built locally with maven like development jhipster-bom.
    // mavenLocal()
    mavenCentral()
    maven { url "https://nexus.hpp.io/repository/maven-releases" }
    maven { url "https://nexus.hpp.io/repository/maven-snapshots" }
    // jhipster-needle-gradle-repositories - JHipster will add additional repositories
}

apply plugin: 'io.spring.dependency-management'

apply from: "gradle/liquibase.gradle"
// jhipster-needle-gradle-apply-from - JHipster will add additional gradle scripts to be applied here

if (project.hasProperty("prod")) {
    apply from: "gradle/profile_prod.gradle"
} else if (project.hasProperty("test2")) {
    apply from: "gradle/profile_test2.gradle"
} else {
    apply from: "gradle/profile_dev.gradle"
}

if (project.hasProperty("war")) {
    apply from: "gradle/war.gradle"
}

if (project.hasProperty("zipkin")) {
    apply from: "gradle/zipkin.gradle"
}

eclipse {
    sourceSets {
        main {
            java {
                srcDirs += ["build/generated/sources/annotationProcessor/java/main"]
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs += [
                    "build/generated/sources/annotationProcessor/java/main"
            ]
        }
    }
}

tasks.named("clean") {
    // Also clean the generated sources directory
    delete "build/generated"
}

defaultTasks "bootRun"

springBoot {
    mainClass = "io.hpp.noosphere.gw.NoosphereGatewayApp"
}

bootRun {
    jvmArgs = [
        "-Xms512m",
        "-Xmx2048m",
        "-XX:+HeapDumpOnOutOfMemoryError",
        "-Dspring.output.ansi.enabled=always",
    ]
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'FAILED', 'SKIPPED'
    }
    jvmArgs += '-Djava.security.egd=file:/dev/./urandom -Xmx512m'
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_13)) {
        jvmArgs += [
            "-XX:+AllowRedefinitionToAddDeleteMethods"
        ]
    }
    reports.html.required = false
    testLogging.exceptionFormat "full"
}

test {
    exclude "**/*IT*", "**/*IntTest*"
}

check.dependsOn integrationTest
task testReport(type: TestReport) {
    destinationDirectory = file("$buildDir/reports/tests")
    testResults.from(test)
}

task integrationTestReport(type: TestReport) {
    destinationDirectory = file("$buildDir/reports/tests")
    testResults.from(integrationTest)
}

gitProperties {
    failOnNoGitDirectory = false
    keys = ["git.branch", "git.commit.id.abbrev", "git.commit.id.describe"]
}

tasks.withType(com.gorylenko.GenerateGitPropertiesTask).configureEach {
    outputs.doNotCacheIf("Task is always executed") { true }
}


configurations {
    providedRuntime
    implementation.exclude module: "spring-boot-starter-tomcat"
    implementation.exclude module: "spring-boot-starter-web"
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-cache"
    implementation "javax.cache:cache-api"
    implementation "com.hazelcast:hazelcast-spring"

    implementation "com.bucket4j:bucket4j-core:8.1.0"
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta" // querydsl JPAAnnotationProcessor 사용 지정
    annotationProcessor "jakarta.annotation:jakarta.annotation-api" // java.lang.NoClassDefFoundError (javax.annotation.Generated) 대응 코드
    annotationProcessor "jakarta.persistence:jakarta.persistence-api" //

    implementation "com.fasterxml.jackson.core:jackson-databind"

    implementation "com.fasterxml.jackson.datatype:jackson-datatype-hppc"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
    implementation "com.github.ben-manes.caffeine:caffeine"
    testImplementation("com.tngtech.archunit:archunit-junit5-api:${archunitJunit5Version}") {
        exclude group: "org.slf4j", module: "slf4j-api"
    }
    testRuntimeOnly("com.tngtech.archunit:archunit-junit5-engine:${archunitJunit5Version}") {
        exclude group: "org.slf4j", module: "slf4j-api"
    }
    implementation "io.micrometer:micrometer-registry-prometheus-simpleclient"
    runtimeOnly "io.netty:netty-tcnative-boringssl-static"
    testImplementation "io.projectreactor.tools:blockhound-junit-platform:${blockhoundJunitPlatformVersion}"
    implementation "jakarta.annotation:jakarta.annotation-api"
    implementation "org.apache.commons:commons-lang3"
    compileOnly 'org.projectlombok:lombok:1.18.40'
    annotationProcessor 'org.projectlombok:lombok:1.18.40'
    testCompileOnly 'org.projectlombok:lombok:1.18.40'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.40'
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    implementation "org.springframework.boot:spring-boot-configuration-processor"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    implementation "org.springframework.boot:spring-boot-loader-tools"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-aop"
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-client"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-webflux"
    testImplementation "org.springframework.boot:spring-boot-test"
    implementation "org.springframework.cloud:spring-cloud-starter"
    implementation "org.springframework.cloud:spring-cloud-starter-bootstrap"
    implementation "org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j"
    implementation "org.springframework.cloud:spring-cloud-starter-consul-config"
    implementation "org.springframework.cloud:spring-cloud-starter-consul-discovery"
    implementation "org.springframework.data:spring-data-commons"
    implementation "org.springframework.retry:spring-retry"
    testImplementation "org.springframework.security:spring-security-test"
    implementation platform(libs.spring.cloud.dependencies)
    implementation platform(libs.feign.reactor.bom)
    implementation libs.jackson.databind.nullable
    implementation libs.jhipster.framework
    implementation libs.springdoc.openapi.starter.webflux.api
    implementation "org.springframework.cloud:spring-cloud-starter-gateway"
    implementation "com.playtika.reactivefeign:feign-reactor-cloud"
    implementation "com.playtika.reactivefeign:feign-reactor-spring-configuration"
    implementation "com.playtika.reactivefeign:feign-reactor-webclient"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.security:spring-security-data"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-hibernate6"
    implementation "com.fasterxml.jackson.module:jackson-module-jaxb-annotations"
    implementation "com.mysql:mysql-connector-j"
    implementation "com.zaxxer:HikariCP"
    implementation "org.hibernate.orm:hibernate-core"
    implementation "org.hibernate.validator:hibernate-validator"
    testImplementation "org.testcontainers:jdbc"
    testImplementation "org.testcontainers:junit-jupiter"
    testImplementation "org.testcontainers:mysql"
    testImplementation "org.testcontainers:testcontainers"
    annotationProcessor "org.hibernate.orm:hibernate-jpamodelgen"
    annotationProcessor "org.glassfish.jaxb:jaxb-runtime"
//    developmentOnly "org.springframework.boot:spring-boot-docker-compose"
    implementation "org.zalando:problem-spring-webflux:0.29.1"
    // jhipster-needle-gradle-dependency - JHipster will add additional dependencies here
    OperatingSystem os = org.gradle.nativeplatform.platform.internal.DefaultNativePlatform.getCurrentOperatingSystem();
    Architecture arch = org.gradle.nativeplatform.platform.internal.DefaultNativePlatform.getCurrentArchitecture();
    if (os.isMacOsX() && !arch.isAmd64()) {
        implementation("io.netty:netty-resolver-dns-native-macos") {
            artifact {
                classifier = "osx-aarch_64"
            }
        }
    }

    implementation "org.keycloak:keycloak-admin-client:26.0.7"
    implementation libs.web3j.core
    implementation "io.hpp:noosphere-common:${noosphereCommonVersion}"
}

task cleanResources(type: Delete) {
    delete "build/resources"
}


compileJava.dependsOn processResources
processResources.dependsOn bootBuildInfo
